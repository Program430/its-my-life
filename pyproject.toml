[project]
name = "its-my-life"
version = "0.1.0"
description = ""
authors = [
    {name = "ATimur",email = "abdtimurrif@gmail.com"}
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "google-genai (>=2.30.1,<3.0.0)",
    "groq (>=1.7.0,<2.0.0)",
    "aiogram (>=3.31.0,<4.0.0)",
    "cryptography (>=50.0.2,<51.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.17.0,<0.18.0)"
]
